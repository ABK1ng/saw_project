<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href={% static "css/saw_warehouse.css" %}>
    <title>Склад пилы</title>
</head>
<body>
  <table>
    <thead>
        <tr>
            <th>Маркировка</th>
            <th>Количесвто</th>
            <th>Длина</th>
        </tr>
    </thead>
    <tbody>
        {% for material in materials %}
            <tr>
                <td>{{ material.name }}</td>
                <td>{{ material.quantity}}</td>
                <td>{{ material.total_length}}</td>
            </tr>
        {% endfor %}
    </tbody>
  </table>
</body>
</html>

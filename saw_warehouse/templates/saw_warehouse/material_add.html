{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Добавление металла</title>
</head>
<body>
    <form method="POST">
        {% csrf_token %}
        <label>
            <p>Маркировка</p>
            <input type="text" name="material_name">
        </label>
        <label>
            <p>Количество</p>
            <input type="number" name="material_quantity" required min="1">
        </label>
        <label>
            <button type="submit">Сохранить</button>
        </label>
    </form>
</body>
</html>
